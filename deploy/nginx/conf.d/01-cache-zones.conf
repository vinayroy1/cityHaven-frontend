# ==============================================================================
# Awasio Microcache Storage Zones (Shared RAM + SSD)
# ==============================================================================

# 1. Metadata Zone: platform config, cities, localities, plans, sitemaps
# - 10MB keys zone in shared RAM (~80,000 cached keys)
# - Max size: 100MB on disk
# - Inactive TTL: 15 minutes
proxy_cache_path /var/cache/nginx/awasio_metadata
    levels=1:2
    keys_zone=awasio_metadata_cache:10m
    max_size=100m
    inactive=15m
    use_temp_path=off;

# 2. Search Zone: autocomplete suggestions, search listings queries
# - 20MB keys zone in shared RAM (~160,000 cached query URLs)
# - Max size: 250MB on disk
# - Inactive TTL: 5 minutes
proxy_cache_path /var/cache/nginx/awasio_search
    levels=1:2
    keys_zone=awasio_search_cache:20m
    max_size=250m
    inactive=5m
    use_temp_path=off;

# 3. PDP & Content Zone: Property Detail Pages (PDP), Project Details, Blog, Advisors
# - 20MB keys zone in shared RAM (~160,000 cached detail pages)
# - Max size: 300MB on disk
# - Inactive TTL: 10 minutes
proxy_cache_path /var/cache/nginx/awasio_pdp
    levels=1:2
    keys_zone=awasio_pdp_cache:20m
    max_size=300m
    inactive=10m
    use_temp_path=off;

# 4. Static Images Zone: Next.js optimized WebP images
# - 15MB keys zone in shared RAM (~120,000 cached images)
# - Max size: 500MB on disk
# - Inactive TTL: 7 days
proxy_cache_path /var/cache/nginx/awasio_static
    levels=1:2
    keys_zone=awasio_static_cache:15m
    max_size=500m
    inactive=7d
    use_temp_path=off;

# Cache Bypass Mapping:
# 1. Bypass cache if Authorization header is present (logged-in user actions)
map $http_authorization $bypass_auth {
    default 0;
    "~.+"   1;
}

# 2. Only cache GET and HEAD methods (never cache POST, PUT, DELETE, PATCH)
map $request_method $bypass_method {
    default 1;
    GET     0;
    HEAD    0;
}
