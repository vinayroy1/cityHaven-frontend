# ==============================================================================
# Awasio Rate Limiting & Anti-Flood Zones
# ==============================================================================

# Map to allow authorized load-testing scripts to test capacity without triggering single-IP 429
map $http_user_agent $rate_limit_key {
    default $binary_remote_addr;
    "~*k6-stress" "";
}

# General API: 150 requests/sec per IP (shared 10MB memory zone holds ~160,000 IPs)
limit_req_zone $rate_limit_key zone=api_general_limit:10m rate=150r/s;

# Search Endpoints: 60 requests/sec per IP to safeguard DB & OpenSearch
limit_req_zone $rate_limit_key zone=api_search_limit:10m rate=60r/s;

# Return HTTP 429 (Too Many Requests) when a single client exceeds limit
limit_req_status 429;
