# Common Proxy & Keepalive Headers
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Cache Key: full URL with protocol, method, host, path, and query parameters
proxy_cache_key "$scheme$request_method$host$request_uri";

# Bypass rules: Never cache authenticated users, mutating HTTP verbs, or forced cache-busting
proxy_cache_bypass $bypass_auth $bypass_method;
proxy_no_cache $bypass_auth $bypass_method;

# Ignore upstream headers so Nginx microcache TTL is strictly enforced
proxy_ignore_headers Cache-Control Expires Set-Cookie;
proxy_hide_header Set-Cookie;

# Serve stale cached copy if backend is restarting or under brief timeout
proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
proxy_cache_background_update on;
proxy_cache_lock on;
proxy_cache_lock_timeout 3s;

# Cache debug headers visible in browser DevTools / curl (HIT, MISS, BYPASS, EXPIRED)
add_header X-Cache-Status $upstream_cache_status always;
add_header X-Microcache-Engine "Awasio-Nginx-Edge" always;
